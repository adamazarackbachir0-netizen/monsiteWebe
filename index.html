<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Royal Shopping</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- SITE COMPLET (CACHÉ AU DÉPART) -->
<div id="main-site">

    <!-- HEADER -->
    <header>
        <h2 class="logo">Royal Shopping</h2>
        <nav class="menu-titles">
            <a class="menu-title" href="#">Accueil</a>
            <a class="menu-title" href="#products">Montres Femme</a>
            <a class="menu-title" href="#products">Montres Homme</a>
            <a class="menu-title" href="#products">Bracelets</a>
            <a class="menu-title" href="#products">Accessoires</a>
            <a class="menu-title" href="#cart">🛒 Panier</a>
        </nav>
        <nav class="menu-btn" id="menuBtn" onclick="toggleMenu()">
            <a href="#">☰</a>
        </nav>
    </header>

   <!-- HERO -->
<section class="hero">
    <h1>Royal Shopping</h1>
    <p>Découvrez notre sélection exclusive au meilleur prix</p>
</section>

<!-- PRODUITS -->
<section class="products" id="products" style="display:block;">
    <h2>Nos produits</h2>

    <!-- Boutons de filtre par catégorie -->
    <div id="category-filters">
        <button onclick="filterProducts('all')">Tous</button>
        <button onclick="filterProducts('montres-femme')">Montres Femme</button>
        <button onclick="filterProducts('montres-homme')">Montres Homme</button>
        <button onclick="filterProducts('bracelets')">Bracelets</button>
        <button onclick="filterProducts('accessoires')">Accessoires</button>
    </div>

    <!-- Conteneur où les produits seront insérés dynamiquement -->
    <div id="products-container"></div>
</section>

</div>

<script src="script.js"></script>
</body>
